<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-label="05 SAFE">
  <!--
    Fifth step icon for the end-to-end flow on smart-energy.php.

    The other four (image/e2e_step_1..4.png) are raster exports of the brand's
    S-mark and there is no source file for a fifth, so this is drawn to match
    the set rather than copied from it: same outer ring, same two-green palette
    sampled from e2e_step_3.png (#6FA88A ring, #05582F mark), same optical
    weight. It is vector, so it stays sharp where the PNGs soften on a 2x
    screen - replace it with a proper export if the brand set ever gains one.
  -->
  <circle cx="140" cy="140" r="126" fill="none" stroke="#6FA88A" stroke-width="7"/>

  <!-- Shield: the "safe" idea, sized to sit inside the S without crowding it -->
  <path d="M140 62 L196 86 v52 c0 40-24 68-56 82-32-14-56-42-56-82V86z"
        fill="none" stroke="#05582F" stroke-width="11"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- S-mark centred in the shield, echoing the other four icons -->
  <path d="M160 112c-6-7-14-10-22-10-11 0-19 6-19 15 0 8 6 12 19 16 15 5 25 11 25 25 0 14-12 23-27 23-10 0-19-4-25-11"
        fill="none" stroke="#05582F" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node dots, the recurring motif in the other icons -->
  <circle cx="168" cy="105" r="8" fill="#fff" stroke="#05582F" stroke-width="6"/>
  <circle cx="112" cy="177" r="8" fill="#fff" stroke="#05582F" stroke-width="6"/>
</svg>
